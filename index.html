<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Glimmer · Feed Preview</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#EFEBE3;color:#2B4C5B;font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
.box{background:#FAF8F3;border:1px solid #E2DDD2;border-radius:18px;padding:34px 30px;width:min(92vw,360px);text-align:center;box-shadow:0 10px 30px rgba(43,76,91,.08)}
h1{font:600 28px Georgia,serif;margin:0 0 6px}p{color:#7D7366;font-size:13.5px;margin:0 0 18px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #E2DDD2;background:#fff;color:#2B4C5B;font-size:15px;box-sizing:border-box}
button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:#2B4C5B;color:#FAF8F3;font-weight:600;font-size:15px;cursor:pointer}
.err{color:#C2362B;font-size:13px;min-height:18px;margin-top:10px}</style></head>
<body><div class=box><h1>Glimmer Pilates</h1><p>Private feed preview. Enter the password to view.</p>
<form id=f><input id=p type=password placeholder="Password" autofocus autocomplete=off><button>Open</button><div class=err id=e></div></form></div>
<script>
const SALT="PkaqjS0LL7fUFLBNs7TDJA==",ITER=200000;
const dec=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const e=document.getElementById('e');e.textContent='Opening…';
try{const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('p').value),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(SALT),iterations:ITER,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},true,['decrypt']);
const r=await fetch('app.bin?t='+Date.now(),{cache:'no-store'}); if(!r.ok)throw new Error('load');
const b=new Uint8Array(await r.arrayBuffer());
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12));
try{sessionStorage.setItem('glimmer.mk',btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',k)))))}catch(x){}
const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();
}catch(x){e.textContent=(x&&x.message==='load')?'Could not load. Try again.':'Wrong password.';}});
</script></body></html>
